[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Keep this file ASCII-only: alembic reads it with the system locale encoding.
# The real URL is filled in by pipeline.core.db.migrate() or migrations/env.py.
sqlalchemy.url = pipeline-default

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: 資料管線
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      # setup-uv 不提供主版本標籤（v10），必須寫完整版本
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: 契約 schema 與程式碼一致
        run: |
          uv run python -m pipeline schema
          git diff --exit-code ../site/src/lib/contract/schema.json

  site:
    name: 網站
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 前端型別與 schema 一致
        run: |
          pnpm gen:types
          git diff --exit-code src/lib/contract/types.ts
      - run: pnpm build
